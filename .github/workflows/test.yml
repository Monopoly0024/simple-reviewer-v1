name: Test skill tooling

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill metadata and structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", skill, re.S)
          assert match, "SKILL.md frontmatter is missing"
          assert re.search(r"^name: simple-reviewer-v1$", match.group(1), re.M)
          assert re.search(r"^description: .+", match.group(1), re.M)
          assert "[TODO:" not in skill
          print("Skill metadata and required files are present")
          PY
      - name: Run report generator tests
        run: python -B scripts/test_reviewer_report.py
      - name: Validate example review
        run: python -B scripts/reviewer_report.py validate assets/review.example.json
      - name: Render illustrated example
        run: python -B scripts/reviewer_report.py render assets/review.example.json --out review-output

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python -B scripts/reviewer_report.py render assets/review.example.json --out review-output
      - run: node scripts/test_breakdown_browser.cjs review-output/code-breakdown.html review-output/browser
      - run: node scripts/test_overview_browser.cjs review-output/reviewer-overview.html review-output/overview-browser
      - run: node scripts/test_terms_browser.cjs review-output/reviewer-overview.html review-output/code-breakdown.html review-output/report.html
      - run: node scripts/test_page_navigation_browser.cjs
      - run: node scripts/test_workflow_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: illustrated-example
          path: review-output/
